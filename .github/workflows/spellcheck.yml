name: Spellcheck

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/spellcheck.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/workflows/spellcheck.yml"

permissions:
  contents: read

jobs:
  spellcheck:
    name: Check Spelling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install codespell
        run: python -m pip install --upgrade codespell

      - name: Run codespell
        run: codespell --skip=".git" --ignore-words-list="NTARI,JFA"
